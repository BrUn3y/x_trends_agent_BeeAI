[project]
name = "beeai-agents"
version = "0.1.1"
description = "X trends analysis agent built with BeeAI"
readme = "README.md"
authors = [{ name = "IBM Corp." }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "beeai-framework[duckduckgo,mcp]>=0.1.81",
    "python-dotenv>=1.0.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
